<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANIMATION</title>
    <link rel="stylesheet" href="a4.css"> 
</head>
<body> 

<header>
<h1>NBA PLAYERS - Animated</h1> 
</header>

<div class="grid">
    <div class="card-wrap">
      <div class="card-inner">
        <div class="face">
          <div class="top-bar"></div>
          <div class="img-area">
            <img src="kawahi ani.png" alt="Kawhi Leonard"/>
          </div>
          <div class="front-info">
            <div class="team-lbl">LA Clippers</div>
            <div class="player-name">Kawhi Leonard</div>
          </div>
        </div>
        <div class="face back">
          <div class="top-bar"></div>
          <div class="back-img-area">
            <img src="kawhi leonard.png" alt="Kawhi Leonard"/>
          </div>
          <div class="back-info">
            <div class="back-name">Kawhi Leonard</div>
            <div class="back-pos">Small Foward #2 6'6"</div>
            <div class="stats">
              <div><div class="stat-val">28.3</div><div class="stat-lbl">PPG</div></div>
              <div><div class="stat-val">6.3</div><div class="stat-lbl">RPG</div></div>
              <div><div class="stat-val">3.6</div><div class="stat-lbl">APG</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
 
    <div class="card-wrap">
      <div class="card-inner">
        <div class="face">
          <div class="top-bar"></div>
          <div class="img-area">
            <img src="kyrie ani.png" alt="Kyrie Irving"/>
          </div>
          <div class="front-info">
            <div class="team-lbl">Dallas Mavericks</div>
            <div class="player-name">Kyrie Irving</div>
          </div>
        </div>
        <div class="face back">
          <div class="top-bar"></div>
          <div class="back-img-area">
            <img src="kyrie.png" alt="Kyrie Irving"/>
          </div>
          <div class="back-info">
            <div class="back-name">Kyrie Irving</div>
            <div class="back-pos">Guard #11 6'2"</div>
            <div class="stats">
              <div><div class="stat-val">24.7</div><div class="stat-lbl">PPG</div></div>
              <div><div class="stat-val">4.8</div><div class="stat-lbl">RPG</div></div>
              <div><div class="stat-val">4.6</div><div class="stat-lbl">APG</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
 
    <div class="card-wrap">
      <div class="card-inner">
        <div class="face" style="--accent:#131313;">
          <div class="top-bar"></div>
          <div class="img-area">
            <img src="harden.png" alt="James Harden"/>
          </div>
          <div class="front-info">
            <div class="team-lbl">Cleveland Cavaliers</div>
            <div class="player-name">James Harden</div>
          </div>
        </div>
        <div class="face back" style="--accent:#C8102E;">
          <div class="top-bar"></div>
          <div class="back-img-area">
            <img src="harden card.jpg" alt="James Harden"/>
          </div>
          <div class="back-info">
            <div class="back-name">James Harden</div>
            <div class="back-pos">Shooting Guard #1 6'5"</div>
            <div class="stats">
              <div><div class="stat-val">24.6</div><div class="stat-lbl">PPG</div></div>
              <div><div class="stat-val">6.7</div><div class="stat-lbl">RPG</div></div>
              <div><div class="stat-val">8.5</div><div class="stat-lbl">APG</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
 
  </div>
 
<div class="ball">
  <a href="ap2.html"><img src="real bb.png" alt="basketball"></a>
</div>
 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splack</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="aap3.css"/>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">s<span>p</span>lack</div>
        </div>

    <div class="channel-list">
      <div class="section-title">Live Channels</div>
      <div class="channel active"><span>🏀</span> NBA <span class="live-tag">LIVE</span></div>
      <div class="channel"><span>⚽</span> Premier League</div>
      <div class="channel"><span>⚾</span> MLB</div>
      <div class="section-title">Analysis</div>
      <div class="channel"><span>#</span> predictions</div>
      <div class="channel"><span>#</span> highlights</div>
      <div class="section-title">Direct Messages</div>
      <div class="channel"><span>🏀</span> NBA Fans</div>
      <div class="channel"><span>⚽</span> Premier League Fans</div>
      <div class="channel"><span>⚾</span> MLB Fans</div>
    </div>
    
    <div class="my-profile">
      <div class="my-avatar">Me</div>
      <div>
        <div class="my-name">Me</div>
        <div class="my-status">🟢 Active</div>
      </div>
    </div>
</div>
 
  <div class="main">
    <div class="topbar">
      <div class="channel-name">🏀 NBA</div>
      <div class="channel-info">Playoffs · Live</div>
    </div>
   
    <div class="scores" id="scores"></div>
  </div>
 
  <script src="aap.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splack</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="aap3.css"/>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">s<span>p</span>lack</div>
            <div class="sidebar-icons">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;cursor:pointer;color:#cdb3ce">
                 <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;cursor:pointer;color:#cdb3ce">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </div>
        </div>
        
    <div class="channel-list">
        <div class="section-title">Live Channels</div>
        <div class="channel active" data-channel="nba" onclick="switchChannel(this, 'nba', '🏀 NBA')"><span>🏀</span> NBA <span class="live-tag">LIVE</span></div>
        <div class="channel" data-channel="epl" onclick="switchChannel(this, 'epl', '⚽ Premier League')"><span>⚽</span> Premier League</div>
        <div class="channel" data-channel="mlb" onclick="switchChannel(this, 'mlb', '⚾ MLB')"><span>⚾</span> MLB<span class="live-tag">LIVE</span></div>
        <div class="section-title">Analysis</div>
        <div class="channel" data-channel="predictions" onclick="switchChannel(this, 'predictions', '# predictions')"><span>#</span> predictions</div>
        <div class="channel" data-channel="highlights" onclick="switchChannel(this, 'highlights', '# highlights')"><span>#</span> highlights</div>
        <div class="section-title">Direct Messages</div>
        <div class="channel" data-channel="dm-nba" onclick="switchChannel(this, 'dm-nba', '🏀 NBA Fans')"><span>🏀</span> NBA Fans</div>
        <div class="channel" data-channel="dm-epl" onclick="switchChannel(this, 'dm-epl', '⚽ Premier League Fans')"><span>⚽</span> Premier League Fans</div>
        <div class="channel" data-channel="dm-mlb" onclick="switchChannel(this, 'dm-mlb', '⚾ MLB Fans')"><span>⚾</span> MLB Fans</div>
    </div>
    
    <div class="my-profile">
      <div class="my-avatar">Me</div>
      <div>
        <div class="my-name">Me</div>
        <div class="my-status">🟢 Active</div>
      </div>
    </div>
</div>
 
  <div class="main">
    <div class="topbar">
      <div class="channel-name" id="channelName">🏀 NBA</div>
      <div class="channel-info">Live</div> 
      <svg onclick="loadScores(document.querySelector('.channel.active').dataset.channel)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:18px;height:18px;margin-left:auto;cursor:pointer;color:#616061;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#616061'">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
  </svg>
    </div>
   
   <div class="scores" id="scores"></div>
    <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Message #nba..." />
         <button onclick="sendMessage()">Send</button>
    </div>

  <script src="aap.js"></script>

</body>
</html>
